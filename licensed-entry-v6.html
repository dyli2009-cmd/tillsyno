<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#132b38">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>Tillsyno – arbetsområden</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 65%,#deece9,transparent 65%),#f6f8f8;color:#183548}
body{min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.shell{width:min(660px,calc(100% - 40px));margin:0 auto;padding:22px 0 40px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:38px;color:#36554c;font-size:14px}.mark{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:#203b44;color:white;font-weight:800}
.card{padding:0;background:transparent}
h1{margin:0 0 8px;font-size:28px;font-weight:650;letter-spacing:-.9px;overflow-wrap:anywhere}.lead{margin:0;color:#718781;font-size:13px;line-height:1.6}
.status{margin-top:18px;color:#718781;font-size:12px}.status[hidden]{display:none}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:26px}
.choice{position:relative;width:100%;min-height:176px;padding:22px;display:flex;flex-direction:column;align-items:flex-start;gap:20px;border:1px solid #315158;border-radius:24px;background:linear-gradient(145deg,#28494f,#142d35);box-shadow:0 16px 40px -20px #1b4b4b55;color:#f5faf8;font:inherit;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s}
.choice:hover{transform:translateY(-2px);box-shadow:0 20px 44px -18px #1b4b4b66}.choice:focus-visible{outline:3px solid #67a58f;outline-offset:4px}
.choice strong,.choice small{display:block}.choice strong{font-size:18px;font-weight:600;letter-spacing:-.3px}.choice small{margin-top:7px;color:#a9c2bb;font-size:11px;line-height:1.55;overflow-wrap:anywhere}
.choiceIcon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#c5ecdf15;color:#c5ecdf}.choiceIcon svg{width:25px;height:25px}
.choice b{position:absolute;right:20px;top:27px;font-size:25px;font-weight:400;color:#b6d9ce}
.choice.disabled{opacity:.6;cursor:not-allowed;box-shadow:none}.choice.disabled:hover{transform:none}
.choice.return{grid-column:1/-1;min-height:44px;padding:10px 4px;display:block;border:0;background:transparent;color:#486a5c;box-shadow:none}.choice.return strong{font-size:12px}.choice.return .choiceIcon,.choice.return small,.choice.return b{display:none}
.error{margin-top:18px;padding:14px;border-radius:14px;border:1px solid #efcaca;background:#fff1f1;color:#8a3f3f;font-size:12px}
.back{display:inline-flex;align-items:center;min-height:44px;margin-top:24px;color:#668275;font-size:12px;font-weight:600;text-decoration:none}
@media(max-width:500px){.list{grid-template-columns:1fr;gap:12px}.choice{min-height:136px;padding:20px;gap:14px}.choiceIcon{width:38px;height:38px;border-radius:12px}.choiceIcon svg{width:23px;height:23px}.choice b{top:23px}.brand{margin-bottom:30px}}
@media(min-width:700px){.shell{padding-top:30px}.brand{margin-bottom:54px}}
@media(prefers-reduced-motion:reduce){.choice{transition:none}.choice:hover{transform:none}}
.protocolSelect{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:19px;border:1px solid #d8e4de;border-radius:18px;background:white;cursor:pointer;transition:background .15s,border-color .15s}
.protocolSelect.selected{background:#eaf6ef;border-color:#86b7a1}.protocolSelect input{width:22px;height:22px;flex:0 0 auto;accent-color:#35694f;cursor:pointer}
.protocolSelect strong{display:block;font-size:15px;font-weight:600;color:#2d4e40}.protocolSelect small{display:block;margin-top:5px;font-size:11px;line-height:1.5;color:#81968a}
.protocolSelect:focus-within{outline:2px solid #67a58f;outline-offset:3px}.continueButton{grid-column:1/-1;min-height:52px;border:0;border-radius:16px;background:#24483f;color:#edf8f2;font:inherit;font-size:14px;font-weight:650;cursor:pointer;margin-top:6px}
.continueButton:disabled{background:#d9e4df;color:#8c9e94;cursor:not-allowed}.continueButton:focus-visible{outline:3px solid #67a58f;outline-offset:3px}
</style>
<link rel="manifest" href="manifest.webmanifest?v=2.4.256"><meta name="apple-mobile-web-app-title" content="Tillsyno">

<link rel="stylesheet" href="tillsyno-appearance.css?v=2.4.325">
</head>
<body>
<main class="shell">
  <div class="brand"><span class="mark">T</span><strong>Tillsyno</strong></div>
  <section class="card">
    <h1 id="title">Kontrollerar åtkomst…</h1>
    <p id="lead" class="lead">Förbereder dina arbetsområden.</p>
    <div id="status" class="status" hidden></div>
    <div id="list" class="list"></div>
    <div id="error" class="error" hidden></div>
    <a class="back" href="https://tillsyno-test.floot.app/konto">‹ Till startsidan</a>
  </section>
</main>
<script>
(()=>{
'use strict';
const PORTAL='https://tillsyno-test.floot.app';
const STORAGE='tillsynoLicensedAccessV4';
const params=new URLSearchParams(location.search);
const token=params.get('token')||'';
const title=document.getElementById('title');
const lead=document.getElementById('lead');
const status=document.getElementById('status');
const list=document.getElementById('list');
const errorBox=document.getElementById('error');

function fail(message){
  title.textContent='Åtkomsten kunde inte öppnas';
  lead.textContent='Öppna Tillsyno på nytt från portalen.';
  status.hidden=true; list.innerHTML=''; errorBox.hidden=false; errorBox.textContent=message||'Okänt fel.';
}
function save(access){try{sessionStorage.setItem(STORAGE,JSON.stringify(access))}catch(_){}}
function saved(){try{return JSON.parse(sessionStorage.getItem(STORAGE)||'null')}catch(_){return null}}
function button(label,sub,fn,disabled=false,key=''){
  const b=document.createElement('button');
  const returning=label.startsWith('‹');
  b.type='button';b.className='choice'+(disabled?' disabled':'')+(returning?' return':'');b.disabled=disabled;
  const icon=document.createElement('span');icon.className='choiceIcon';icon.setAttribute('aria-hidden','true');
  const paths=key==='projektflode'?'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11m4-7h4m-4 4h4"/>':key==='dorrautomatik'?'<path d="M5 21V3h14v18M8 21V6h8v15M11 12h2M3 21h18"/>':key==='brand'?'<path d="M13 3s1 5-3 7c-1-2-2-3-2-3s-4 4-4 8a8 8 0 0 0 16 0c0-4-4-8-4-8s1 5-3 5"/>':key==='sakerhetsservice'?'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>':'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v4H9zM9 12h6M9 16h6"/>';
  icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+paths+'</svg>';
  const span=document.createElement('span'),strong=document.createElement('strong'),small=document.createElement('small'),arrow=document.createElement('b');
  strong.textContent=label;small.textContent=sub;arrow.textContent=disabled?'':'›';span.append(strong,small);b.append(icon,span,arrow);
  if(!disabled)b.onclick=fn;
  list.appendChild(b);
}
function moduleProtocols(module){
  return Array.isArray(module?.protocols)?module.protocols:[];
}
function backToModules(access){
  button('‹ Till arbetsområden','Gå tillbaka till dina tilldelade områden',()=>showModules(access));
}
function openProtocol(module,protocol){
  const appKey=protocol.appProtocolKey||'';
  if(!appKey)return;
  if(appKey==='automation'||appKey==='automation_selfcheck'||appKey==='lock_revision'){
    location.href='./licensed-door-v1.html?module='+encodeURIComponent(module.key)+'&protocol='+encodeURIComponent(appKey)+'&v=3';
    return;
  }
  if(['alarm','lock','access','fire_panel','fire_detector','fire_door'].includes(appKey)){
    location.href='./licensed-control-v1.html?module='+encodeURIComponent(module.key)+'&protocol='+encodeURIComponent(appKey)+'&v=2';
  }
}

function showSelectedProtocols(access,module){
  title.textContent=module.name||'Dörrautomatik';
  lead.textContent='Välj ett eller flera protokoll.';
  status.hidden=true;list.innerHTML='';
  const selected=new Set();
  const isDoor=module.key==='dorrautomatik';
  const supported=isDoor?['automation','automation_selfcheck','lock_revision']:['alarm','lock','access','fire_panel','fire_detector','fire_door'];
  const choices=moduleProtocols(module).filter(p=>supported.includes(p.appProtocolKey));
  const next=document.createElement('button');
  next.type='button';next.className='continueButton';next.textContent='Fortsätt till ritning';next.disabled=true;
  choices.forEach(protocol=>{
    const label=document.createElement('label');label.className='protocolSelect';
    const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=protocol.appProtocolKey;
    const text=document.createElement('span'),name=document.createElement('strong'),description=document.createElement('small');
    name.textContent=protocol.name;description.textContent=protocol.description||'';
    text.append(name,description);label.append(checkbox,text);
    checkbox.onchange=()=>{
      if(checkbox.checked)selected.add(protocol.appProtocolKey);else selected.delete(protocol.appProtocolKey);
      label.classList.toggle('selected',checkbox.checked);
      next.disabled=selected.size===0;
    };
    list.appendChild(label);
  });
  next.onclick=()=>{
    if(!selected.size)return;
    const target=isDoor?'licensed-door-v1.html':'licensed-control-v1.html';
    location.href='./'+target+'?module='+encodeURIComponent(module.key)+'&protocols='+encodeURIComponent([...selected].join(','))+'&v=6';
  };
  list.appendChild(next);
  backToModules(access);
}

function showProtocolArea(access,module){
  if(['dorrautomatik','sakerhetsservice','brand'].includes(module.key)){showSelectedProtocols(access,module);return;}
  title.textContent=module.name;
  lead.textContent='Välj vilket protokoll du ska arbeta med.';
  status.hidden=true;
  list.innerHTML='';
  const protocols=moduleProtocols(module);
  if(!protocols.length){
    button(module.name,'Inga protokoll är upplagda ännu',()=>{},true);
  }else{
    protocols.forEach(protocol=>{
      const linked=Boolean(protocol.appProtocolKey);
      button(
        protocol.name,
        linked?(protocol.description||'Öppna protokoll'):'Inte kopplad till arbetsappen ännu',
        ()=>openProtocol(module,protocol),
        !linked
      );
    });
  }
  backToModules(access);
}
function showModules(access){
  if(!access||!Array.isArray(access.moduleKeys)||!access.moduleKeys.length){fail('Inga aktiva arbetsområden är tilldelade.');return}
  const modules=Array.isArray(access.modules)?access.modules:[];
  title.textContent='Hej '+(access.displayName||'');
  lead.textContent=(access.companyName||'Ditt företag')+' · välj arbetsområde.';
  status.hidden=true;
  list.innerHTML='';
  access.moduleKeys.forEach(key=>{
    const module=modules.find(item=>item.key===key)||{key,name:key,description:'',protocols:[]};
    const protocols=moduleProtocols(module);
    const protocolNames=protocols.map(protocol=>protocol.name).join(' · ');
    if(protocols.length){
      button(module.name||key,protocolNames||'Öppna arbetsområde',()=>showProtocolArea(access,module),false,key);
    }else if(key==='projektflode'){
      button(module.name||'Projektflöde',module.description||'Ritning · matchning · status',()=>{location.href='./licensed-project-v1.html?v=2'},false,key);
    }else{
      button(module.name||key,'Inga protokoll är upplagda ännu',()=>{},true,key);
    }
  });
}
async function start(){
  if(!token){
    const access=saved();
    if(access){showModules(access);return}
    fail('Ingen startnyckel hittades.');
    return;
  }
  try{
    const response=await fetch(PORTAL+'/_api/app/validate_launch',{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify({token})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.message||'Verifieringen misslyckades.');
    history.replaceState(null,'',location.pathname);
    save(data.access);
    showModules(data.access);
  }catch(e){fail(e&&e.message?e.message:'Kunde inte verifiera åtkomsten.')}
}
start();
})();
</script>
<script src="offline.js?v=2.4.256"></script>
<script src="tillsyno-appearance.js?v=2.4.325"></script>
</body>
</html>
