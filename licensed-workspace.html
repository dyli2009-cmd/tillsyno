<html lang="sv" data-auth-pending>
<head><meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#132b38">\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">
<title>Tillsyno</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}iframe{width:100%;height:100%;border:0;background:white}.gate{height:100%;display:grid;place-items:center;padding:24px;color:#15243a}.gate>div{width:min(520px,100%);padding:28px;border:1px solid #d8e3eb;border-radius:20px;background:white;text-align:center}.gate a{display:inline-block;margin-top:18px;color:#315f81;font-weight:700;text-decoration:none}
</style>

<link rel="stylesheet" href="tillsyno-appearance.css?v=2.4.353">
</head>
<body>
<div id="gate" class="gate"><div><strong>Kontrollerar modulåtkomst…</strong></div></div>
<script>
const STORAGE='tillsynoLicensedAccessV1';
const params=new URLSearchParams(location.search);
const moduleKey=params.get('module')||'';
const workflow=params.get('workflow')||'';
let saved=null;
try{saved=JSON.parse(sessionStorage.getItem(STORAGE)||'null')}catch{}
const access=saved&&saved.access?saved.access:null;
const gate=document.getElementById('gate');
function denied(text){gate.innerHTML='<div><h2>Åtkomst saknas</h2><p>'+text+'</p><a href="./licensed-entry.html?menu=1">Till mina moduler</a></div>'}
if(!access||!Array.isArray(access.moduleKeys)||!access.moduleKeys.includes(moduleKey)){
  denied('Den här modulen är inte tilldelad till ditt konto.');
}else{
  const securityMap={las:'lock',passer:'access',inbrottslarm:'alarm'};
  let src='';
  if(moduleKey==='dorrautomatik') src='./all-in-one.html';
  else if(securityMap[moduleKey]) src='./security.html';
  else denied('Den här arbetsytan är inte färdigbyggd ännu.');
  if(src){
    gate.remove();
    const frame=document.createElement('iframe');
    frame.src=src;
    frame.title='Tillsyno arbetsyta';
    document.body.appendChild(frame);
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        if(!doc)return;
        if(moduleKey==='dorrautomatik'){
          const protocol=workflow==='selfcheck'?'automation_selfcheck':workflow==='revision'?'automation':'';
          if(!protocol){
            location.href='./licensed-entry.html?menu=1';
            return;
          }
          const labels={
            automation:'Checklista revision dörrautomatik',
            automation_selfcheck:'Egenkontroll dörrautomatik'
          };
          const applyLicensedProtocol=()=>{
            try{
              const win=frame.contentWindow;
              const dialog=doc.getElementById('allProtocolDialog');
              if(win&&win.AllInOneProtocols)win.AllInOneProtocols.set([protocol]);
              doc.querySelectorAll('#allProtocolDialog input[type="checkbox"][value]').forEach(cb=>{
                cb.checked=cb.value===protocol;
              });
              if(dialog&&dialog.open)dialog.close();
              doc.querySelectorAll('.allInOneProtocolTools [data-add]').forEach(btn=>{
                btn.hidden=btn.getAttribute('data-add')!==protocol;
              });
              const brand=doc.querySelector('.brand strong');
              if(brand)brand.textContent=labels[protocol];
              const subtitle=doc.querySelector('.headerSubtitle');
              if(subtitle)subtitle.textContent='Dörrautomatik · '+(protocol==='automation'?'revision':'egenkontroll');
              doc.querySelectorAll('a[href="./"]').forEach(link=>{
                link.setAttribute('href','javascript:void(0)');
                link.onclick=()=>{location.href='./licensed-entry.html?menu=1';return false};
              });
            }catch(e){}
          };
          setTimeout(applyLicensedProtocol,90);
          setTimeout(applyLicensedProtocol,220);
        }else{
          const allow=securityMap[moduleKey];
          doc.querySelectorAll('[data-add]').forEach(btn=>{
            if(btn.getAttribute('data-add')!==allow)btn.style.display='none';
          });
          const homeLink=doc.querySelector('.headerActions a[href="./"]');
          if(homeLink){
            homeLink.setAttribute('href','javascript:void(0)');
            homeLink.onclick=()=>{location.href='./licensed-entry.html?menu=1';return false};
          }
          const title=doc.querySelector('.brand strong');
          const labels={las:'Lås & Dörrmiljö',passer:'Passer',inbrottslarm:'Inbrottslarm'};
          if(title)title.textContent=labels[moduleKey]||'Säkerhetsservice';
        }
      }catch(e){}
    });
  }
}
</script>
<script src="tillsyno-appearance.js?v=2.4.353"></script>
</body>
</html>
