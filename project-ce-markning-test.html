<!doctype html>
<html lang="sv" data-auth-pending>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132b38">
<meta http-equiv="Cache-Control" content="no-cache">
<title>CE-märkning TEST 2 | Tillsyno</title>
<style>html[data-auth-pending] body{visibility:hidden!important}</style>
<script src="vendor/supabase-2.49.10.min.js"></script>
<script src="auth-config.js"></script>
<script src="auth/client.js?v=2.4.287"></script>
<script src="auth/guard.js?v=2.4.287" defer></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/jszip-3.10.1.min.js"></script>
<link rel="stylesheet" href="project-ce-markning-test-v2.css?v=2">
<script src="project-ce-markning-test-v2-module.js?v=2"></script>
<script src="project-ce-markning-test-v2.js?v=2" defer></script>

<body>
<header class="ceTop"><div><strong>CE-märkning <small>TEST 2</small></strong></div><a href="index.html" aria-label="Till Tillsyno" class="ceIcon">⌂</a></header>
<main class="ceShell">
 <details class="ceProject" id="ceProject"><summary>Projektuppgifter</summary><div class="ceGrid">
  <label>Projekt<input data-meta="projectName" placeholder="Projektnamn"></label>
  <label>Kund<input data-meta="customer" placeholder="Kund"></label>
  <label>Adress<input data-meta="address" placeholder="Adress"></label>
  <label>Företag<input data-meta="company" placeholder="Företag"></label>
  <label>Kontakt<input data-meta="contact" placeholder="Kontaktperson"></label>
  <label>Order<input data-meta="order" placeholder="Ordernummer"></label>
  <label>Utförd av<input data-meta="technician" placeholder="Namn"></label>
  <label>Datum<input data-meta="date" type="date"></label>
 </div></details>
 <div class="ceTools"><button id="ceAddToggle" class="cePrimary" type="button">＋ Dörr</button><button id="ceSaveLocal" type="button">Spara lokalt</button><button id="ceSavePdf" type="button">Spara PDF</button><label for="ceOpenPdf" class="ceButton">Öppna PDF</label><input id="ceOpenPdf" type="file" hidden accept="application/pdf,.pdf"></div>
 <form id="ceDoorForm" hidden class="ceDoorForm"><div class="ceGrid">
  <label>Automatiknummer<input id="ceDoorNumber" required placeholder="20-01-54-28-24-2" autocomplete="off"></label>
  <label>Placering<input id="ceDoorLocation" required placeholder="Entré, plan 1"></label>
 </div><div class="ceFormEnd"><select id="ceDoorType" aria-label="Utförande"><option value="glass">Med glas</option><option value="noGlass">Utan glas</option></select><button id="ceDoorSubmit" class="cePrimary" type="submit">Lägg till</button><button id="ceDoorCancel" type="button">Avbryt</button></div></form>
 <div class="ceListHead"><strong>Dörrautomatiker</strong><span id="ceDoorCount">0 st</span></div>
 <div id="ceDoorList"></div>
 <p id="ceEmpty" class="ceEmpty">Lägg till automatiknummer och placering. Öppna dörren för att fylla i CE-dokumenten.</p>
 <p id="ceStorageStatus" class="ceMuted" role="status" aria-live="polite"></p>
 <p class="ceMuted ceFoot">Separat CE-test · mallar läggs in en gång · gemensamma svar följer glasvalet.</p>
</main>
<div id="ceNotice" role="status" aria-live="polite" hidden></div>
</body>
</html>
