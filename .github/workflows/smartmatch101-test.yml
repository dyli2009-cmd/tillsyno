name: SmartMatch 10.1 isolated tests
on:
  push:
    branches: [smartmatch-10-1-isolated-20261017]
    paths: ['smartmatch10-1*', 'tests/smartmatch101*', '.github/workflows/smartmatch101-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          for file in smartmatch10-1*.js; do node --check "$file"; done
      - name: Browser checks
        if: hashFiles('tests/smartmatch101-browser.cjs') != ''
        run: |
          npm install --prefix /tmp/smartmatch101-test playwright@1.56.1
          /tmp/smartmatch101-test/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/smartmatch101-server.log 2>&1 &
          NODE_PATH=/tmp/smartmatch101-test/node_modules node tests/smartmatch101-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smartmatch101-validation
          path: |
            smartmatch10-1*
            vendor/
            auth/guard.js
            tests/smartmatch101-results*
          retention-days: 3
