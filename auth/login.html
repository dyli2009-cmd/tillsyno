<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tillsyno – inloggning</title>
<style>body{font:16px system-ui;background:#102b38;color:#fff;margin:0;padding:2rem}main{max-width:420px;margin:8vh auto}input,button{display:block;width:100%;box-sizing:border-box;padding:.85rem;margin:.65rem 0 1.2rem;border-radius:8px;font:inherit}button{background:#d2ecf8;color:#102b38;font-weight:700}label{display:block}p{line-height:1.5}</style></head>
<body><main><h1>Tillsyno</h1><p>Logga in med ditt personliga konto.</p>
<form id="login"><label>E-post<input type="email" name="email" autocomplete="username" required></label>
<label>Lösenord<input type="password" name="password" autocomplete="current-password" required></label>
<button type="submit">Logga in</button></form><p id="message" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script src="../auth-config.js"></script><script src="login.js"></script>
</body></html>
