<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Välj nytt lösenord – Tillsyno</title>
<link rel="stylesheet" href="admin.css?v=2.4.281"></head>
<body class="loginbody"><main class="loginshell">
<div class="brand loginbrand">Tillsyno<small>Tillsyn · kontroll · dokumentation</small></div>
<section class="logincard">
<h1>Välj nytt lösenord</h1>
<p id="hint">Kontrollerar din personliga återställningslänk…</p>
<form id="resetForm" hidden>
<label for="password">Nytt lösenord (minst 12 tecken)</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<label for="repeat">Upprepa lösenordet</label>
<input id="repeat" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<button id="saveBtn" class="primary" type="submit">Spara nytt lösenord</button>
</form>
<p id="status" role="status" aria-live="polite" class="notice" hidden></p>
</section><p class="loginhelp" id="links"><a href="forgot-password.html">Begär en ny länk</a> · <a href="login.html">Till inloggningen</a></p>
</main>
<script src="../vendor/supabase-2.49.10.min.js"></script><script src="../auth-config.js"></script>
<script>
(async()=>{
 'use strict';
 const el=id=>document.getElementById(id);
 const show=(text,isError=false)=>{el('status').hidden=!text;el('status').textContent=text;el('status').className='notice '+(isError?'error':'success');};
 if(!window.supabase?.createClient||!window.TILLSYNO_AUTH_CONFIG){
  show('Återställningen kunde inte laddas. Anslut till internet och ladda om sidan.',true);return;
 }
 // The recovery page uses an isolated, non-persistent session. It never grants app access.
 const config=window.TILLSYNO_AUTH_CONFIG;
 const client=window.supabase.createClient(config.url,config.publishableKey,{
  auth:{detectSessionInUrl:true,flowType:'implicit',persistSession:false,autoRefreshToken:false}
 });
 const recoveryHint=new URLSearchParams(location.hash.substring(1)).get('type')==='recovery';
 let ready=false,completed=false,unlocking=false;
 const unlock=async()=>{
  if(unlocking||ready||completed)return;
  unlocking=true;
  try{
   const {data,error}=await client.auth.getUser();
   if(error||!data?.user)throw Error('Invalid recovery session');
   ready=true;el('resetForm').hidden=false;
   el('hint').textContent='Ange ett nytt starkt lösenord för ditt Tillsyno-konto.';
   show('');
   // Remove access tokens from browser history/address bar after the auth client consumes them.
   if(location.hash)history.replaceState(null,'',location.pathname);
  }catch(_){
   show('Länken är ogiltig eller har gått ut. Begär en ny återställningslänk.',true);
  }finally{unlocking=false;}
 };
 client.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY')setTimeout(()=>void unlock(),0);
 });
 try{
  await client.auth.initialize();
  const {data,error}=await client.auth.getSession();
  if(error)throw error;
  // If recovery was processed during initialization, the original hash identifies the flow.
  if(recoveryHint&&data?.session)await unlock();
  if(!ready&&!unlocking)show('Ingen giltig återställningslänk hittades. Begär en ny länk.',true);
 }catch(_){show('Det gick inte att kontrollera länken. Begär en ny återställningslänk.',true);}
 el('resetForm').addEventListener('submit',async event=>{
  event.preventDefault();
  if(!ready||completed)return;
  const password=el('password').value,repeat=el('repeat').value;
  if(password.length<12||password.length>128){show('Lösenordet måste innehålla minst 12 tecken.',true);return;}
  if(password!==repeat){show('Lösenorden är inte identiska.',true);return;}
  const button=el('saveBtn');button.disabled=true;
  show('Sparar lösenordet…');
  try{
   const {error}=await client.auth.updateUser({password});
   if(error)throw error;
   completed=true;ready=false;
   try{await client.auth.signOut({scope:'global'});}catch(_){}
   el('resetForm').hidden=true;
   el('hint').textContent='Ditt lösenord är ändrat. Du kan nu logga in med det nya lösenordet.';
   show('Lösenordet är sparat.');
  }catch(error){
   show('Det gick inte att ändra lösenordet. Försök igen eller begär en ny länk.',true);
  }finally{button.disabled=false;}
 });
})();
</script></body></html>
