<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Byt lösenord – Tillsyno</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box}
body{min-height:100dvh;display:grid;place-items:center;margin:0;background:#0e2936;color:#f1f8fb;padding:20px}
main{width:min(100%,430px);background:#183947;border:1px solid #476775;border-radius:16px;padding:28px}
h1{font-size:1.55rem;margin:0 0 12px}p{line-height:1.5;color:#c8d9e0}
label{display:block;margin:17px 0 7px;font-weight:600}
input,button{width:100%;padding:13px;border-radius:9px;font:inherit}
input{background:#0c2430;color:white;border:1px solid #7296a4}
button{background:#bde8f7;color:#0a2937;border:0;font-weight:700;margin-top:22px}
button:disabled{opacity:.6}
#status{white-space:pre-line;margin-top:17px;min-height:20px}
[hidden]{display:none!important}a{color:#bde8f7}
</style>
</head>
<body>
<main>
<h1>Välj nytt lösenord</h1>
<p id="hint">Öppna din personliga länk för att välja ett lösenord till Tillsyno.</p>
<form id="resetForm" hidden>
<label for="password">Nytt lösenord, minst 12 tecken</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" required>
<label for="repeat">Upprepa lösenordet</label>
<input id="repeat" type="password" autocomplete="new-password" minlength="12" required>
<button id="saveBtn" type="submit">Spara lösenord</button>
</form>
<p id="status" role="status" aria-live="polite">Kontrollerar återställningslänken…</p>
<p id="done" hidden><a href="./login.html">Till inloggningen</a></p>
</main>
<script src="../vendor/supabase-2.49.10.min.js"></script>
<script src="../auth-config.js"></script>
<script>
(async () => {
  'use strict';
  const el = id => document.getElementById(id);
  const show = (msg) => { el('status').textContent = msg; };
  if (!window.supabase?.createClient || !window.TILLSYNO_AUTH_CONFIG) {
    show('Det gick inte att starta lösenordsåterställningen. Kontrollera internetanslutningen och ladda om sidan.');
    return;
  }
  const config = window.TILLSYNO_AUTH_CONFIG;
  const client = window.supabase.createClient(config.url, config.publishableKey, {
    auth: { detectSessionInUrl: true, flowType: 'implicit', persistSession: false, autoRefreshToken: false }
  });
  let ready = false;
  const authorizeRecovery = async () => {
    if (ready) return;
    const { data, error } = await client.auth.getUser();
    if (error || !data.user) return;
    ready = true;
    el('resetForm').hidden = false;
    show('');
  };
  client.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      window.setTimeout(authorizeRecovery, 0);
    }
  });
  try {
    await client.auth.initialize();
    const { data, error } = await client.auth.getSession();
    if (error) throw error;
    if (data.session) await authorizeRecovery();
    if (!ready) show('Ingen giltig länk hittades. Be administratören om en ny personlig länk.');
  } catch (error) {
    show('Länken gick inte att verifiera. Begär en ny återställningslänk i Supabase.');
  }
  el('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = el('password').value;
    if (newPassword.length < 12) return show('Lösenordet behöver minst 12 tecken.');
    if (newPassword !== el('repeat').value) return show('Lösenorden är inte identiska.');
    const button = el('saveBtn');
    button.disabled = true;
    show('Sparar ditt nya lösenord…');
    try {
      const { error } = await client.auth.updateUser({ password: newPassword });
      if (error) throw error;
      await client.auth.signOut({ scope: 'local' });
      el('resetForm').hidden = true;
      el('hint').textContent = 'Ditt lösenord är sparat. Logga in för att öppna Tillsyno.';
      el('done').hidden = false;
      show('Lösenordet har ändrats.');
    } catch (error) {
      show('Kunde inte spara lösenordet: ' + (error.message || 'Begär en ny återställningslänk.'));
    } finally { button.disabled = false; }
  });
})();
</script>
</body>
</html>
