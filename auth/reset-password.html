<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<script id="tillsyno-appearance-early">(function(){var theme='mist',device='auto';try{var saved=JSON.parse(localStorage.getItem('tillsyno-ui-appearance-v1')||'null');if(saved&&['ice','mist','coast','sand','night','graphite','pine'].indexOf(saved.theme)>=0)theme=saved.theme;if(saved&&['auto','phone','tablet','desktop'].indexOf(saved.device)>=0)device=saved.device;}catch(_){}var page={ice:'#edf6fb',mist:'#ebf1f5',coast:'#edf7f6',sand:'#f7f5f1',night:'#081523',graphite:'#12151c',pine:'#091c1e'}[theme];document.documentElement.style.setProperty('--tillsyno-route-bg',page);document.documentElement.style.setProperty('background',page,'important');document.documentElement.setAttribute('data-tillsyno-theme',theme);document.documentElement.setAttribute('data-tillsyno-device',device);})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Välj nytt lösenord – Tillsyno</title>
<link rel="stylesheet" href="admin.css?v=2.4.282">
<link rel="stylesheet" href="../tillsyno-appearance.css?v=2.4.358">
</head>
<body class="loginbody"><main class="loginshell">
<div class="brand loginbrand ta-brandlockup"><span class="ta-brandmark" aria-hidden="true">T</span><span class="ta-brandcopy"><strong>Tillsyno</strong><small>Kontroll · dokumentation · tillsyn</small></span></div>
<section class="logincard">
<h1>Välj nytt lösenord</h1>
<p id="hint">Kontrollerar din personliga återställningslänk…</p>
<form id="resetForm" hidden>
<label for="password">Nytt lösenord (minst 12 tecken)</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<label for="repeat">Upprepa lösenordet</label>
<input id="repeat" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<button id="saveBtn" class="primary" type="submit">Spara nytt lösenord</button>
</form>
<p id="status" role="status" aria-live="polite" class="notice" hidden></p>
</section><p class="loginhelp" id="links"><a href="forgot-password.html">Begär en ny länk</a> · <a href="login.html">Till inloggningen</a></p>
</main>
<script src="../vendor/supabase-2.49.10.min.js"></script><script src="../auth-config.js"></script>
<script>
(async()=>{
 'use strict';
 const el=id=>document.getElementById(id);
 const show=(text,isError=false)=>{el('status').hidden=!text;el('status').textContent=text;el('status').className='notice '+(isError?'error':'success');};
 if(!window.supabase?.createClient||!window.TILLSYNO_AUTH_CONFIG){
  show('Återställningen kunde inte laddas. Anslut till internet och ladda om sidan.',true);return;
 }
 const hash=new URLSearchParams(location.hash.slice(1)),params=new URLSearchParams(location.search);
 // Capture intent BEFORE Supabase consumes the fragment.
 const recoveryIntent=hash.get('type')==='recovery'||params.get('type')==='recovery'||params.get('flow')==='recovery';
 const config=window.TILLSYNO_AUTH_CONFIG;
 const client=window.supabase.createClient(config.url,config.publishableKey,{
  auth:{detectSessionInUrl:true,flowType:'implicit',persistSession:false,autoRefreshToken:false}
 });
 let recoveryEvent=false,ready=false,completed=false,revealing=false;
 const reveal=async()=>{
  if(ready||completed||revealing||(!recoveryIntent&&!recoveryEvent))return;
  revealing=true;
  try{
   const {data:sessionData,error:sessionError}=await client.auth.getSession();
   const session=sessionData?.session;
   if(sessionError||!session?.access_token)return;
   const {data,error}=await client.auth.getUser(session.access_token);
   if(error||!data?.user)return;
   ready=true;
   el('resetForm').hidden=false;
   el('hint').textContent='Skriv ditt nya lösenord och bekräfta det.';
   show('');
   // Never leave credentials in the browser address/history after successful verification.
   if(location.hash||location.search)history.replaceState(null,'',location.pathname);
  }catch(_){show('Länken kunde inte verifieras. Begär en ny återställningslänk.',true);}
  finally{revealing=false;}
 };
 client.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){recoveryEvent=true;setTimeout(()=>void reveal(),0);}
 });
 try{
  // Handles recovery credentials in URL fragments and token_hash variants.
  if(params.get('type')==='recovery'&&params.get('token_hash')){
   const {error}=await client.auth.verifyOtp({type:'recovery',token_hash:params.get('token_hash')});
   if(error)throw error;
  }
  await client.auth.initialize();
  await reveal();
  if(!ready){
   if(params.get('error')||hash.get('error')){
    show('Länken har gått ut eller är ogiltig. Begär en ny återställningslänk.',true);
   }else{
    show('Vi kunde inte öppna lösenordsformuläret från den här länken. Begär en ny återställningslänk och öppna den senaste i mejlet.',true);
   }
  }
 }catch(_){show('Länken har gått ut eller är ogiltig. Begär en ny återställningslänk.',true);}
 el('resetForm').addEventListener('submit',async event=>{
  event.preventDefault();
  if(!ready||completed)return;
  const password=el('password').value,repeat=el('repeat').value;
  if(password.length<12||password.length>128){show('Lösenordet måste innehålla minst 12 tecken.',true);return;}
  if(password!==repeat){show('Lösenorden är inte identiska.',true);return;}
  const button=el('saveBtn');button.disabled=true;
  show('Sparar ditt nya lösenord…');
  try{
   const {error}=await client.auth.updateUser({password});
   if(error)throw error;
   completed=true;ready=false;
   try{await client.auth.signOut({scope:'local'});}catch(_){}
   el('resetForm').hidden=true;
   el('hint').textContent='Ditt lösenord är ändrat. Nästa gång loggar du in med det nya lösenordet.';
   show('Lösenordet har sparats. Du kan nu logga in igen.');
  }catch(_){show('Kunde inte spara lösenordet. Försök igen eller begär en ny länk.',true);}
  finally{button.disabled=false;}
 });
})();
</script><script src="../tillsyno-appearance.js?v=2.4.358"></script>
</body></html>
