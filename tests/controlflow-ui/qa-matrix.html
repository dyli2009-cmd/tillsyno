<!doctype html><html><head><meta charset="utf-8"><title>Kontrollflöde QA</title></head><body><h1>Kontrollflöde QA</h1><pre id="results">Running</pre><div id="frames"></div><script>
(async()=>{const out=[];const cases=[];for(const module of ['','controlflow-revision/'])for(const width of [1440,834,390,320])for(const theme of ['mist','night'])cases.push({module,width,theme});for(const theme of ['ice','coast','sand','graphite','pine'])cases.push({module:'',width:390,theme});for(const device of ['phone','tablet'])cases.push({module:'',width:1440,theme:'mist',device});for(const c of cases){const f=document.createElement('iframe');f.style=`display:block;width:${c.width}px;height:${c.width===320?740:c.width===390?844:c.width===834?1194:900}px;border:0`;document.getElementById("frames").append(f);const result=await new Promise(resolve=>{const timeout=setTimeout(()=>resolve({ok:false,...c,errors:['Timeout']}),30000);function done(e){if(e.source===f.contentWindow&&e.data?.type==='controlflow-qa'){clearTimeout(timeout);removeEventListener('message',done);resolve(e.data.result)}}addEventListener('message',done);f.src=`/${c.module}all-in-one.html?qa=checks&theme=${c.theme}&device=${c.device||'auto'}`});out.push(result);document.getElementById('results').textContent=JSON.stringify(out,null,2);f.remove();}await fetch('/__qa/results',{method:'POST',body:JSON.stringify(out)});document.title=out.every(x=>x.ok)?'PASS Kontrollflöde QA':'FAIL Kontrollflöde QA';})();
</script></body></html>
